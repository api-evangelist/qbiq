aid: qbiq
name: Qbiq
description: >-
  Qbiq is an AI-powered space planning and architectural visualization platform for real estate.
  It lets brokers, architects, developers, and space planners generate optimized 2D floor plans,
  photorealistic 3D renderings, virtual tours, Revit/CAD models, and quantity takeoffs from an
  uploaded space plan (CAD, PDF, or JPEG) in minutes. Qbiq automates test-fits and layout
  optimization for offices and commercial real estate, comparing multiple design options against
  program requirements. The company is backed by Insight Partners and was added to the API
  Evangelist network from a VC portfolio. As of this enrichment pass Qbiq operates a hosted web
  application (plan.qbiq.ai) and publishes no public API, developer portal, SDKs, or machine-readable
  specifications.
